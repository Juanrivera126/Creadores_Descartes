<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulación: el futuro del aprendizaje automático</title>
    <style>
        :root{--bg-dark:#1a1a1d;--bg-panel:#2c2c30;--accent:#c9a55c;--text-main:#e0e0e0;--success:#4caf50;--warning:#ff9800;--danger:#f44336;}
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif;}
        body{background:var(--bg-dark);color:var(--text-main);display:flex;flex-direction:column;height:100vh;}
        header{background:var(--bg-panel);border-bottom:2px solid var(--accent);padding:15px;display:flex;justify-content:space-between;align-items:center;}
        .stat-box{background:rgba(0,0,0,0.3);padding:8px 15px;border-radius:5px;border:1px solid #444;text-align:center;}
        .main-container{display:grid;grid-template-columns:1fr 300px;flex:1;overflow:hidden;}
        .stage{padding:30px;overflow-y:auto;}
        .scenario-card{background:var(--bg-panel);padding:25px;border-radius:8px;border:1px solid #444;}
        .artwork-visual{width:100%;height:300px;background:#000;border-radius:5px;margin:20px 0;position:relative;overflow:hidden;border:3px solid #333;}
        .artwork-visual img{width:100%;height:100%;object-fit:cover;opacity:0.8;}
        .choices-grid{display:grid;gap:15px;margin-top:20px;}
        .choice-btn{background:transparent;border:1px solid var(--accent);color:var(--text-main);padding:15px;text-align:left;border-radius:5px;cursor:pointer;transition:all 0.3s;}
        .choice-btn:hover{background:var(--accent);color:var(--bg-dark);}
        .sidebar{background:#222;border-left:1px solid #444;padding:20px;overflow-y:auto;}
        .log-entry{margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #333;font-size:0.9em;}
        .log-entry.success{border-left:3px solid var(--success);padding-left:10px;}
        .log-entry.warning{border-left:3px solid var(--warning);padding-left:10px;}
        .log-entry.danger{border-left:3px solid var(--danger);padding-left:10px;}
        @media(max-width:800px){.main-container{grid-template-columns:1fr;}}
    </style>
</head>
<body>
    <header>
        <h2 style="color:var(--accent);font-size:1.2rem;">Simulador: el futuro del aprendizaje automático</h2>
        <div style="display:flex;gap:15px;">
            <div class="stat-box">Recursos: <strong id="sB">500</strong></div>

            <div class="stat-box">Progreso: <strong id="sA">0</strong>/5</div>
        </div>
    </header>
    <div class="main-container">
        <div class="stage" id="stage"></div>
        <div class="sidebar">
            <h3 style="color:var(--accent);margin-bottom:15px;">Registro</h3>
            <div id="logEntries"></div>
        </div>
    </div>

    <script>
        const scenarios = JSON.parse(document.getElementById('activity-data').textContent);
        let st = { b: 500, p: 50, curr: 0 };
        
        function updateUI() {
            document.getElementById('sB').textContent = st.b; document.getElementById('sP').textContent = st.p; document.getElementById('sA').textContent = st.curr;
        }
        
        function logMsg(msg, type) {
            const d = document.createElement('div'); d.className = 'log-entry ' + type; d.innerHTML = msg;
            document.getElementById('logEntries').prepend(d);
        }

        function renderScen() {
            updateUI();
            if(st.curr >= scenarios.length) {
                document.getElementById('stage').innerHTML = `<h2>Simulación Completada</h2><p>Recursos finales: ${st.b} | Prestigio: ${st.p}</p><button class="choice-btn" onclick="location.reload()" style="margin-top:20px;text-align:center;">Jugar de nuevo</button>`;
                return;
            }
            const s = scenarios[st.curr];
            const imgUrl = s.imageBase64; 
            
            let html = `<div class="scenario-card">
                <h2 style="color:var(--accent)">${s.title}</h2>
                <small style="color:#aaa">${s.period}</small>
                <div class="artwork-visual"><img src="${imgUrl}" alt="${s.artworkName}">
                <div style="position:absolute;bottom:0;width:100%;background:rgba(0,0,0,0.7);padding:10px;text-align:center;">${s.artworkName}</div></div>
                <p style="font-size:1.1em;line-height:1.6">${s.description}</p>
                <div class="choices-grid">`;
            
            s.choices.forEach((c, i) => {
                html += `<button class="choice-btn" onclick="makeChoice(${i})">${c.text} <span style="float:right;background:rgba(0,0,0,0.5);padding:2px 8px;border-radius:10px;font-size:0.8em;">Coste: ${c.cost}</span></button>`;
            });
            html += `</div></div>`;
            document.getElementById('stage').innerHTML = html;
        }

        function makeChoice(idx) {
            const s = scenarios[st.curr]; const c = s.choices[idx];
            st.b += c.effect.budget || 0; st.p += c.effect.prestige || 0;
            logMsg(`<strong>${s.title}:</strong> ${c.feedback}`, c.logType || 'info');
            st.curr++; renderScen();
        }
        renderScen();
    </script>
</body>

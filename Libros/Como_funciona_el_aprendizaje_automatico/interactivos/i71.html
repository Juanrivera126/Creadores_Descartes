<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cómic: evaluación de un modelo de IA</title>
    <style>
        :root{--bg:#0a0e17;--border:#2c3e50;--font:'Comic Sans MS', cursive, sans-serif;}
        body{background:var(--bg);color:#fff;font-family:var(--font);margin:0;padding:20px;}
        .comic-container{max-width:900px;margin:0 auto;}
        .header{text-align:center;background:linear-gradient(135deg, #1a1a3a, var(--bg));border:4px solid var(--border);border-radius:20px;padding:20px;margin-bottom:30px;}
        .header h1{color:#ffe66d;margin:0 0 10px 0;}
        .comic-panel{background:linear-gradient(180deg, #1a1a3a, var(--bg));border:5px solid var(--border);border-radius:15px;padding:25px;margin-bottom:25px;display:none;min-height:350px;position:relative;animation:fadeIn 0.5s ease;}
        .comic-panel.active{display:block;}
        .scene{display:flex;align-items:center;justify-content:center;gap:30px;flex-wrap:wrap;min-height:200px;margin-top:20px;}
        .char-img{width:150px;height:150px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 20px rgba(255,255,255,0.3);animation:float 3s infinite ease-in-out;}
        .speech-bubble{background:#fff;color:#000;padding:15px;border-radius:20px;border:3px solid var(--border);max-width:300px;position:relative;box-shadow:5px 5px 0 rgba(0,0,0,0.5);}
        .speech-bubble::before{content:'';position:absolute;top:50%;left:-15px;border-width:15px 15px 15px 0;border-style:solid;border-color:transparent #fff transparent transparent;margin-top:-15px;}
        .info-box{background:rgba(255,255,255,0.95);color:#000;border-radius:12px;padding:15px;margin-top:20px;border-left:5px solid #4ecdc4;}
        .controls{display:flex;justify-content:center;gap:15px;margin-top:20px;}
        .btn{background:#ff6b35;color:white;border:none;padding:12px 30px;font-size:1.1em;border-radius:50px;cursor:pointer;font-family:var(--font);}
        .btn:hover{background:#e55a2b;}
        @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
        @keyframes fadeIn{from{opacity:0;transform:translateX(30px);}to{opacity:1;transform:translateX(0);}}
        .quiz-opt{display:block;width:100%;padding:10px;margin:8px 0;background:rgba(255,255,255,0.2);border:2px solid transparent;border-radius:8px;color:#fff;cursor:pointer;text-align:left;}
        .quiz-opt:hover{background:rgba(255,255,255,0.3);border-color:#ffe66d;}
        .quiz-opt.correct{background:#4ecdc4;} .quiz-opt.wrong{background:#ff6b35;}
    </style>
</head>
<body>

    <script>
        const cData = JSON.parse(document.getElementById('activity-data').textContent);
        const container = document.getElementById('panelsContainer');
        
        cData.panels.forEach((p, i) => {
            const imgUrl = p.imageBase64;
            container.innerHTML += `<div class="comic-panel ${i===0?'active':''}" id="p${i}">
                <h2 style="color:#ff6b35;text-align:center;">${p.title}</h2>
                <div class="scene">
                    <img src="${imgUrl}" class="char-img" alt="${p.character}">
                    <div class="speech-bubble"><strong>${p.character}:</strong><br>${p.dialogue}</div>
                </div>
                <div class="info-box">
                    <h4 style="color:#ff6b35;margin-top:0;">💡 ${p.infoTitle}</h4>
                    <p style="margin:5px 0;">${p.infoText}</p>
                    <small style="background:#ffe66d;color:#000;padding:3px 8px;border-radius:5px;font-weight:bold;">✨ Dato curioso: ${p.funFact}</small>
                </div>
                <div class="controls">
                    ${i>0 ? `<button class="btn" onclick="showP(${i-1})">Anterior</button>` : ''}
                    <button class="btn" onclick="showP(${i+1})">${i===cData.panels.length-1 ? 'Ir al Quiz Final' : 'Siguiente Panel'}</button>
                </div>
            </div>`;
        });

        const qz = cData.quiz;
        let qzHtml = `<div class="comic-panel" id="p${cData.panels.length}">
            <h2 style="color:#ffe66d;text-align:center;">🏆 ¡Misión Completada! Pon a prueba tu saber:</h2>
            <div style="background:rgba(255,255,255,0.1);padding:20px;border-radius:10px;margin-top:20px;">
                <h3 style="margin-top:0;">${qz.question}</h3>`;
        qz.options.forEach((opt, idx) => {
            qzHtml += `<button class="quiz-opt" onclick="checkQ(this, ${idx === qz.correct}, '${qz.feedback}')">${opt}</button>`;
        });
        qzHtml += `<p id="qFeed" style="margin-top:15px;font-weight:bold;min-height:20px;"></p>
            </div>
            <div class="controls"><button class="btn" onclick="showP(0)">🔄 Leer de nuevo</button></div>
        </div>`;
        container.innerHTML += qzHtml;

        function showP(idx) {
            document.querySelectorAll('.comic-panel').forEach(p => p.classList.remove('active'));
            document.getElementById('p'+idx).classList.add('active');
            window.scrollTo(0,0);
        }

        function checkQ(btn, isCorrect, feedback) {
            document.querySelectorAll('.quiz-opt').forEach(b => b.disabled = true);
            const fbEl = document.getElementById('qFeed');
            if(isCorrect) { btn.classList.add('correct'); fbEl.innerHTML = '✅ ¡Correcto! ' + feedback; fbEl.style.color='#4ecdc4'; }
            else { btn.classList.add('wrong'); fbEl.innerHTML = '❌ Incorrecto. ' + feedback; fbEl.style.color='#ff6b35'; }
        }
    </script>
</body>

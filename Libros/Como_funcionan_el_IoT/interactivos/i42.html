AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQmmt090yQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQ2kt32Af//Z","correctIndex":1,"options":["Verdadero","Falso"]}];
    
    let currentIndex = 0;
    let score = 0;
    let selectedBtn = null;
    let attempts = new Array(quizData.length).fill(null); // null, 'correct', 'incorrect'

    const dom = {
        wrapper: document.getElementById('questions-wrapper'),
        dots: document.getElementById('progress-dots'),
        feedback: document.getElementById('feedback-area'),
        verifyBtn: document.getElementById('verify-btn'),
        nextBtn: document.getElementById('next-btn'),
        gameArea: document.getElementById('game-area'),
        resultsArea: document.getElementById('results'),
        finalScore: document.getElementById('final-score'),
        title: document.getElementById('main-title')
    };

    function init() {
        renderDots();
        renderQuestion();
        
        dom.verifyBtn.addEventListener('click', checkAnswer);
        dom.nextBtn.addEventListener('click', nextQuestion);
    }

    function renderDots() {
        dom.dots.innerHTML = '';
        quizData.forEach((_, i) => {
            const d = document.createElement('div');
            d.className = 'dot';
            d.textContent = i + 1;
            if (i === currentIndex) d.classList.add('active');
            if (attempts[i] === 'correct') d.classList.add('completed', 'correct');
            if (attempts[i] === 'incorrect') d.classList.add('completed', 'incorrect');
            dom.dots.appendChild(d);
        });
    }

    function renderQuestion() {
        if (currentIndex >= quizData.length) {
            showResults();
            return;
        }

        const q = quizData[currentIndex];
        dom.title.textContent = `Pregunta ${currentIndex + 1} de ${quizData.length}`;
        
        // Generar HTML de la pregunta actual
        let imgHtml = '';
        if (q.image) {
            imgHtml = `<div class="img-wrapper"><img src="${q.image}" alt="Imagen"></div>`;
        }

        const html = `
            <div class="question-box active">
                ${imgHtml}
                <p style="font-size: 1.2rem; font-weight: 500; text-align: center;">${q.question}</p>
                <div class="options">
                    ${q.options.map((opt, idx) => 
                        `<button class="opt-btn" onclick="selectOption(this, ${idx})">${opt}</button>`
                    ).join('')}
                </div>
            </div>
        `;

        dom.wrapper.innerHTML = html;
        dom.feedback.className = 'feedback hidden';
        dom.feedback.textContent = '';
        selectedBtn = null;
        
        // Reset botones
        dom.verifyBtn.classList.remove('hidden');
        dom.verifyBtn.disabled = true;
        dom.nextBtn.classList.add('hidden');
        
        renderDots();
    }

    // Se hace global para poder llamarla desde el HTML inyectado
    window.selectOption = function(btn, idx) {
        if (attempts[currentIndex]) return; // Ya respondida
        
        // Limpiar selección previa
        const allBtns = document.querySelectorAll('.opt-btn');
        allBtns.forEach(b => b.classList.remove('selected'));
        
        btn.classList.add('selected');
        selectedBtn = { element: btn, index: idx };
        dom.verifyBtn.disabled = false;
    };

    function checkAnswer() {
        if (!selectedBtn) return;
        
        const q = quizData[currentIndex];
        const isCorrect = selectedBtn.index === q.correctIndex;
        
        // Marcar botones
        const allBtns = document.querySelectorAll('.opt-btn');
        allBtns.forEach((btn, idx) => {
            btn.disabled = true;
            if (idx === q.correctIndex) btn.classList.add('correct');
            else if (idx === selectedBtn.index && !isCorrect) btn.classList.add('incorrect');
        });

        // Feedback
        dom.feedback.classList.remove('hidden');
        if (isCorrect) {
            score++;
            dom.feedback.textContent = "¡Correcto!";
            dom.feedback.classList.add('correct');
            attempts[currentIndex] = 'correct';
        } else {
            dom.feedback.textContent = `Incorrecto. La respuesta era: ${q.options[q.correctIndex]}`;
            dom.feedback.classList.add('incorrect');
            attempts[currentIndex] = 'incorrect';
        }

        dom.verifyBtn.classList.add('hidden');
        dom.nextBtn.classList.remove('hidden');
        dom.nextBtn.textContent = (currentIndex === quizData.length - 1) ? "Ver Resultados" : "Siguiente";
        
        renderDots();
    }

    function nextQuestion() {
        currentIndex++;
        renderQuestion();
    }

    function showResults() {
        dom.gameArea.style.display = 'none';
        dom.resultsArea.style.display = 'block';
        const percentage = Math.round((score / quizData.length) * 100);
        dom.finalScore.innerHTML = `Acertaste <b>${score}</b> de <b>${quizData.length}</b> (${percentage}%)`;
        dom.title.textContent = "Resultados";
    }

    // Arrancar
    init();
</script>
